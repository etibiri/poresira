{% extends "core/base.html" %}{% load i18n %}
{# SPDX-License-Identifier: AGPL-3.0-or-later #}
{% block title %}{% trans "Projects" %} · PoreSira{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{% trans "Projects" %}</h1>
<input type="search" name="q" value="{{ search_text }}" class="form-control mb-3"
       placeholder="{% trans 'Filter by code or name' %}"
       hx-get="{% url 'project-list' %}" hx-trigger="input changed delay:300ms, search"
       hx-target="#project-rows" hx-swap="innerHTML">
<table class="table table-hover align-middle">
  <thead>
    <tr><th>{% trans "Code" %}</th><th>{% trans "Name" %}</th><th></th></tr>
  </thead>
  <tbody id="project-rows">{% include "core/_project_rows.html" %}</tbody>
</table>
{% endblock %}
