{% for project in projects %}
<tr>
  <td><code>{{ project.code }}</code></td>
  <td>{{ project.name }}</td>
  <td class="text-end">
    <a href="{% url 'samples:sample-list' %}?project={{ project.pk }}">{% trans "Samples" %}</a> ·
    <a href="{% url 'project-history' project.pk %}">{% trans "History" %}</a>
  </td>
</tr>
{% empty %}
<tr><td colspan="3" class="text-muted">{% trans "No projects to show." %}</td></tr>
{% endfor %}
