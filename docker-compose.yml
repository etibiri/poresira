# Run with: docker compose --profile <poste|labo|plateforme> up -d
x-django-env: &django-env
  env_file: .env
  environment: &django-environment
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0

x-django-service: &django-service
  build:
    context: .
    args:
      PORESIRA_VERSION: ${PORESIRA_VERSION:-dev}
  image: poresira:${PORESIRA_VERSION:-dev}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poresira}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-poresira_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-poresira_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/init-roles.sh:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-poresira}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    # 7.2 is the last BSD-3-Clause release of Redis.
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: [*django-env, *django-service]
    environment:
      <<: *django-environment
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-poresira_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"

  web:
    <<: [*django-env, *django-service]
    environment:
      <<: *django-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:-poresira_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${PORESIRA_PORT:-8000}:8000"

  worker:
    <<: [*django-env, *django-service]
    environment:
      <<: *django-environment
      POSTGRES_USER: ${POSTGRES_APP_USER:-poresira_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "config", "worker", "--loglevel", "info"]

volumes:
  db-data:
  redis-data:
