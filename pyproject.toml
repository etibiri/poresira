# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "poresira"
version = "0.1.0"
description = "Open-source LIMS tracing biological samples from field collection to public data deposition."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ezechiel B. Tibiri" }]
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "django-pghistory>=3.5",
    "celery>=5.4",
    "redis>=5.0",
    "gunicorn>=22.0",
    "whitenoise>=6.7",
    "packaging>=26.3",
]

[project.urls]
Source = "https://github.com/etibiri/poresira"
Issues = "https://github.com/etibiri/poresira/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S608"]
"**/migrations/**" = ["E501", "RUF012"]
"poresira/core/audit_migrations.py" = ["S608"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db --ds=config.settings.test"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["poresira"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
